
{% extends "base.html" %}

{% block head %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap">

<style>
    #game-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #1e242d;
    }

    #gameCanvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        object-fit: contain;
        image-rendering: pixelated;
        background: #1e242d;
    }

    .arcade-stage {
        display: flex !important;
        align-items: center;
        justify-content: center;
        min-height: 540px;
    }

    /* ============ Ventana del nivel ============ */
    .lp-overlay {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 44px;
        padding: 24px;
        --accent: #ff2fd6;
        background: radial-gradient(
            120% 120% at 50% 40%,
            rgba(6, 9, 18, .5),
            rgba(2, 3, 8, .88)
        );
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
        animation: lp-fade .22s ease-out;
    }

    .lp-overlay.hidden {
        display: none;
    }

    @keyframes lp-fade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* ============ Logo izquierdo ============ */
    .lp-logo-wrap {
        flex: 0 0 42%;
        width: 42%;
        max-width: 42%;
        min-width: 0;
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: lp-logofloat 4.5s ease-in-out infinite;
    }

    @keyframes lp-logofloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .lp-logo-wrap::before {
        content: "";
        position: absolute;
        width: 92%;
        height: 66%;
        border-radius: 50%;
        z-index: -1;
        background: radial-gradient(
            circle,
            color-mix(in srgb, var(--accent) 40%, transparent),
            transparent 70%
        );
        filter: blur(10px);
        animation: lp-glow2 3.6s ease-in-out infinite;
    }

    @keyframes lp-glow2 {
        0%, 100% { opacity: .75; }
        50% { opacity: 1; }
    }

    .lp-logo {
        display: block;
        width: 100%;
        height: auto;
        max-width: 500px;
        max-height: none;
        object-fit: contain;
        image-rendering: pixelated;
        filter:
            drop-shadow(0 8px 14px rgba(0, 0, 0, .75))
            drop-shadow(
                0 0 22px color-mix(in srgb, var(--accent) 70%, transparent)
            );
    }

    .lp-title-text {
        margin: 0;
        text-align: center;
        font-family: 'Press Start 2P', monospace;
        font-size: 30px;
        line-height: 1.5;
        color: var(--accent);
        text-shadow:
            0 0 22px color-mix(in srgb, var(--accent) 80%, transparent),
            3px 3px 0 rgba(0, 0, 0, .75);
    }

    /* ============ Tarjeta principal ============ */
    .lp-card {
        position: relative;
        flex: 0 1 560px;
        min-width: 0;
        padding: 22px 24px 24px;

        /* NUEVA TIPOGRAFÍA */
        font-family: 'Share Tech Mono', monospace;
        color: #e9eefb;

        background:
            repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, .025) 0 1px,
                transparent 1px 3px
            ),
            radial-gradient(
                130% 90% at 100% 0%,
                color-mix(in srgb, var(--accent) 15%, transparent),
                transparent 55%
            ),
            linear-gradient(180deg, #0e1424 0%, #0a0e1a 100%);

        border: 2px solid color-mix(
            in srgb, var(--accent) 70%, #1a2238
        );
        border-radius: 18px;

        box-shadow:
            0 22px 70px rgba(0, 0, 0, .65),
            0 0 0 1px rgba(255, 255, 255, .04) inset,
            0 0 46px color-mix(in srgb, var(--accent) 32%, transparent);

        animation:
            lp-pop .26s cubic-bezier(.2, 1.2, .4, 1),
            lp-glow 3.6s ease-in-out infinite;
    }

    @keyframes lp-pop {
        from {
            transform: translateY(16px) scale(.96);
            opacity: 0;
        }
        to {
            transform: none;
            opacity: 1;
        }
    }

    @keyframes lp-glow {
        0%, 100% {
            box-shadow:
                0 22px 70px rgba(0, 0, 0, .65),
                0 0 0 1px rgba(255, 255, 255, .04) inset,
                0 0 40px color-mix(in srgb, var(--accent) 26%, transparent);
        }
        50% {
            box-shadow:
                0 22px 70px rgba(0, 0, 0, .65),
                0 0 0 1px rgba(255, 255, 255, .04) inset,
                0 0 60px color-mix(in srgb, var(--accent) 46%, transparent);
        }
    }

    /* Esquinas decorativas */
    .lp-card .corner {
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2px solid var(--accent);
        pointer-events: none;
        opacity: .9;
    }

    .lp-card .tl {
        top: 9px;
        left: 9px;
        border-right: 0;
        border-bottom: 0;
        border-top-left-radius: 9px;
    }

    .lp-card .tr {
        top: 9px;
        right: 9px;
        border-left: 0;
        border-bottom: 0;
        border-top-right-radius: 9px;
    }

    .lp-card .bl {
        bottom: 9px;
        left: 9px;
        border-right: 0;
        border-top: 0;
        border-bottom-left-radius: 9px;
    }

    .lp-card .br {
        bottom: 9px;
        right: 9px;
        border-left: 0;
        border-top: 0;
        border-bottom-right-radius: 9px;
    }

    /* ============ Cabecera ============ */
    .lp-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .lp-signal {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #7c8aa8;
        letter-spacing: 2px;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
    }

    .lp-signal i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #3ddc84;
        box-shadow: 0 0 8px #3ddc84;
        animation: lp-blink 1.1s steps(1) infinite;
    }

    .lp-status {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        padding: 6px 9px;
        border-radius: 6px;
        letter-spacing: 1px;
    }

    .lp-status.open {
        color: #06260c;
        background: #3ddc84;
        box-shadow: 0 0 12px rgba(61, 220, 132, .6);
    }

    .lp-status.locked {
        color: #fff;
        background: var(--accent);
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
    }

    @keyframes lp-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: .15; }
    }

    /* ============ Nombre del reto ============ */
    .lp-tag {
        font-family: 'Share Tech Mono', monospace;
        font-size: 27px;
        color: #eaf1ff;
        letter-spacing: 1px;
        margin-bottom: 14px;
        font-weight: bold;
    }

    .lp-tag::before {
        content: "“";
        color: var(--accent);
    }

    .lp-tag::after {
        content: "”";
        color: var(--accent);
    }

    /* ============ Vulnerabilidad ============ */
    .lp-exploit {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 13px;
        padding: 9px 13px;
        border-radius: 9px;
        background: linear-gradient(
            90deg,
            color-mix(in srgb, var(--accent) 14%, #070b14),
            #070b14
        );
        border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
        border-left: 4px solid var(--accent);
    }

    .lp-exploit .k {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        color: #8a98b5;
        letter-spacing: 1px;
    }

    .lp-exploit .v {
        font-family: 'Share Tech Mono', monospace;
        font-size: 23px;
        font-weight: bold;
        color: var(--accent);
        line-height: 1;
        margin-left: 2px;
        text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .lp-exploit .cur {
        width: 10px;
        height: 19px;
        margin-left: auto;
        background: var(--accent);
        border-radius: 1px;
        box-shadow: 0 0 8px var(--accent);
        animation: lp-blink .9s steps(1) infinite;
    }

    /* ============ Descripción ============ */
    .lp-msg {
        margin-bottom: 15px;
        padding: 12px 14px;
        border-radius: 11px;
        background: rgba(255, 255, 255, .028);
        border: 1px solid rgba(255, 255, 255, .07);
    }

    .lp-msg-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 7px;
        color: var(--accent);
        letter-spacing: 1px;
        margin-bottom: 7px;
        opacity: .9;
    }

    .lp-msg p {
        font-family: 'Share Tech Mono', monospace;
        margin: 0;
        font-size: 19px;
        line-height: 1.5;
        color: #dbe6f6;
    }

    /* ============ Dificultad ============ */
    .lp-threat {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
    }

    .lp-threat .lbl {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        color: #8a98b5;
        letter-spacing: 1px;
    }

    .lp-pips {
        display: flex;
        gap: 7px;
        margin-left: 4px;
    }

    .lp-pips i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--accent) 60%, #2a3650);
    }

    .lp-pips i.on {
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 9px color-mix(in srgb, var(--accent) 80%, transparent);
    }

    /* ============ Botones ============ */
    .popup-buttons {
        display: flex;
        gap: 14px;
    }

    .popup-buttons button {
        flex: 1;
        font-family: 'Share Tech Mono', monospace;
        font-size: 22px;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 11px 8px;
        border-radius: 11px;
        color: #eaf0fd;
        border: 2px solid;
        border-bottom-width: 6px;
        transition: transform .06s, box-shadow .16s, filter .16s;
    }

    .popup-buttons button:active {
        transform: translateY(4px);
        border-bottom-width: 2px;
    }

    .btn-play {
        background: linear-gradient(180deg, #123024, #0c1f18);
        color: #5affa0 !important;
        border-color: #3ddc84 !important;
        text-shadow: 0 0 10px rgba(61, 220, 132, .6);
    }

    .btn-play:hover {
        box-shadow: 0 0 22px rgba(61, 220, 132, .6);
        filter: brightness(1.12);
    }

    .btn-play.locked {
        background: #0d1320;
        color: #7b879e !important;
        border-color: #34405a !important;
        cursor: not-allowed;
        text-shadow: none;
        filter: grayscale(.4);
    }

    .btn-exit {
        background: linear-gradient(180deg, #2a0d26, #1a0a18);
        color: #ff6fe0 !important;
        border-color: #ff2fd6 !important;
        text-shadow: 0 0 10px rgba(255, 47, 214, .55);
    }

    .btn-exit:hover {
        box-shadow: 0 0 22px rgba(255, 47, 214, .55);
        filter: brightness(1.12);
    }

    /* ============ Pantallas estrechas ============ */
    @media (max-width: 860px) {
        .lp-overlay {
            flex-direction: column;
            gap: 14px;
            padding: 18px;
        }

        .lp-logo-wrap {
            width: 62%;
            max-width: none;
        }

        .lp-logo {
            max-height: 150px;
        }

        .lp-card {
            flex: 0 1 auto;
            width: 100%;
            max-width: 520px;
        }

        .lp-tag {
            font-size: 23px;
        }

        .lp-msg p {
            font-size: 17px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .lp-card,
        .lp-overlay,
        .lp-signal i,
        .lp-exploit .cur,
        .lp-logo-wrap::before {
            animation: none !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div id="game-container">
    <div class="hud-map">
        <div>NIVELES: <span id="hud-progress">1/7</span></div>
        <div>
            <a href="{{ url_for('index') }}">[ SALIR AL MENÚ ]</a>
        </div>
    </div>

    <canvas id="gameCanvas" width="1080" height="540"></canvas>
</div>

<div id="level-popup" class="lp-overlay hidden">
    <div class="lp-logo-wrap">
        <img class="lp-logo" id="lp-logo" src="" alt="">
        <h2 class="lp-title-text" id="popup-title" style="display:none">Nivel</h2>
    </div>

    <div class="lp-card" id="lp-card">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="lp-top">
            <span class="lp-signal"><i></i> SEÑAL</span>
            <span class="lp-status open" id="lp-status">DISPONIBLE</span>
        </div>

        <div class="lp-tag" id="lp-tag"></div>

        <div class="lp-exploit">
            <span class="k">EXPLOIT //</span>
            <span class="v" id="lp-vuln">—</span>
            <span class="cur"></span>
        </div>

        <div class="lp-msg">
            <div class="lp-msg-label">▞ TRANSMISIÓN · PROF. FABIANCHO</div>
            <p id="popup-desc"></p>
        </div>

        <div class="lp-threat">
            <span class="lbl">AMENAZA</span>
            <span class="lp-pips" id="lp-diff-stars"></span>
        </div>

        <div class="popup-buttons">
            <button id="btn-enter-level" class="btn-play">ENTRAR ▸</button>
            <button id="btn-close-popup" class="btn-exit">CANCELAR</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const UNLOCKED_LEVELS = JSON.parse('{{ unlocked_levels | tojson | safe }}');
</script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
