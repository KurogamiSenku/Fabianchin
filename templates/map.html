{% extends "base.html" %}

{% block head %}
<style>
    #game-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #1e242d; /* Fondo visible por si el canvas falla */
    }
    #gameCanvas {
        width: 100% !important;
        height: 100% !important;
        display: block; /* Importante: evita que el canvas sea inline */
        object-fit: contain;
        image-rendering: pixelated;
        background: #1e242d; /* Fondo gris oscuro forzado */
    }
    /* Forzamos que el .arcade-stage no oculte el canvas */
    .arcade-stage {
        display: flex !important;
        align-items: center;
        justify-content: center;
        min-height: 540px; /* Altura fija por si el flex colapsa */
    }
</style>
{% endblock %}

{% block content %}
    <div id="game-container">
        <div class="hud-map">
            <div>NIVELES: <span id="hud-progress">1/14</span></div>
            <div><a href="{{ url_for('index') }}">[ SALIR AL MENÚ ]</a></div>
        </div>
        <canvas id="gameCanvas" width="1080" height="540"></canvas>
    </div>

    <div id="level-popup" class="level-popup hidden">
        <h2 id="popup-title">Nivel 1</h2>
        <p id="popup-desc">Descripción</p>
        <div class="popup-buttons">
            <button id="btn-enter-level" class="btn-play">ENTRAR</button>
            <button id="btn-close-popup" class="btn-exit">CANCELAR</button>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        const UNLOCKED_LEVELS = JSON.parse('{{ unlocked_levels | tojson | safe }}');
    </script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
